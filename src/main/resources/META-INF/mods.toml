modLoader = "javafml"
loaderVersion = "[${neo_major_version},)"
issueTrackerURL = "https://github.com/wootrevived/bloodmagicaddon/issues"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/wootrevived/bloodmagicaddon"
authors = "pharuxtan"
description = '''Woot Revived Addon that add compatibility with Blood Magic'''

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_version}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${neo_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId="woot_revived"
mandatory = true
versionRange = "[${woot_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="bloodmagic"
mandatory = true
versionRange = "[${bloodmagic_version},)"
ordering="NONE"
side="BOTH"
